<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#fff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f1f1f">Context view: what the secure link layer connects to</text>

  <!-- system boundary -->
  <rect x="300" y="120" width="600" height="190" rx="12" fill="#eef3fb" stroke="#2f5496" stroke-width="2" stroke-dasharray="9,6"/>
  <text x="600" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5496">Secure link layer (this project)</text>

  <!-- operator -->
  <rect x="20" y="70" width="230" height="70" rx="10" fill="#f2f2f2" stroke="#7f7f7f" stroke-width="2"/>
  <text x="135" y="101" text-anchor="middle" font-size="16" font-weight="bold">Operator</text>
  <text x="135" y="123" text-anchor="middle" font-size="13" fill="#444">flies missions or by hand</text>

  <!-- GCS software -->
  <rect x="20" y="190" width="230" height="90" rx="10" fill="#f2f2f2" stroke="#7f7f7f" stroke-width="2"/>
  <text x="135" y="225" text-anchor="middle" font-size="16" font-weight="bold">GCS software</text>
  <text x="135" y="248" text-anchor="middle" font-size="13" fill="#444">reused, unchanged</text>
  <text x="135" y="267" text-anchor="middle" font-size="13" fill="#444">sends plain MAVLink</text>
  <line x1="135" y1="140" x2="135" y2="188" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- GCS side proxy -->
  <rect x="325" y="175" width="210" height="110" rx="10" fill="#d9e2f3" stroke="#2f5496" stroke-width="2"/>
  <text x="430" y="210" text-anchor="middle" font-size="16" font-weight="bold">GCS-side proxy</text>
  <text x="430" y="233" text-anchor="middle" font-size="13" fill="#333">encrypts commands,</text>
  <text x="430" y="252" text-anchor="middle" font-size="13" fill="#333">checks telemetry</text>

  <!-- drone side proxy -->
  <rect x="665" y="175" width="210" height="110" rx="10" fill="#d9e2f3" stroke="#2f5496" stroke-width="2"/>
  <text x="770" y="210" text-anchor="middle" font-size="16" font-weight="bold">Drone-side proxy</text>
  <text x="770" y="233" text-anchor="middle" font-size="13" fill="#333">checks commands,</text>
  <text x="770" y="252" text-anchor="middle" font-size="13" fill="#333">encrypts telemetry</text>

  <!-- autopilot -->
  <rect x="950" y="190" width="230" height="90" rx="10" fill="#e2efda" stroke="#548235" stroke-width="2"/>
  <text x="1065" y="225" text-anchor="middle" font-size="16" font-weight="bold">Autopilot</text>
  <text x="1065" y="248" text-anchor="middle" font-size="13" fill="#444">reused, simulated</text>
  <text x="1065" y="267" text-anchor="middle" font-size="13" fill="#444">1 to 3 drones</text>

  <!-- plain links -->
  <line x1="252" y1="235" x2="323" y2="235" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="877" y1="235" x2="948" y2="235" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="287" y="345" text-anchor="middle" font-size="12" fill="#444">plain MAVLink</text>
  <text x="287" y="361" text-anchor="middle" font-size="12" fill="#444">(same machine)</text>
  <text x="912" y="345" text-anchor="middle" font-size="12" fill="#444">plain MAVLink</text>
  <text x="912" y="361" text-anchor="middle" font-size="12" fill="#444">(same vehicle)</text>

  <!-- radio link -->
  <line x1="537" y1="235" x2="663" y2="235" stroke="#2f5496" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="600" y="206" text-anchor="middle" font-size="12" fill="#2f5496" font-weight="bold">protected radio link</text>
  <text x="600" y="223" text-anchor="middle" font-size="12" fill="#2f5496">(simulated)</text>
  

  <!-- attacker -->
  <rect x="460" y="390" width="280" height="90" rx="10" fill="#fbe5e5" stroke="#c00000" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="600" y="423" text-anchor="middle" font-size="16" font-weight="bold" fill="#c00000">Outsider in radio range</text>
  <text x="600" y="446" text-anchor="middle" font-size="13" fill="#333">listens, alters, replays,</text>
  <text x="600" y="464" text-anchor="middle" font-size="13" fill="#333">or forges messages</text>
  <line x1="600" y1="388" x2="600" y2="242" stroke="#c00000" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#r)"/>

  <!-- enrollment -->
  <rect x="440" y="62" width="320" height="42" rx="8" fill="#fff2cc" stroke="#bf9000" stroke-width="1.5"/>
  <text x="600" y="89" text-anchor="middle" font-size="14" fill="#333">Key enrollment on the ground, before flight</text>
  <line x1="520" y1="106" x2="450" y2="172" stroke="#bf9000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#a)"/>
  <line x1="680" y1="106" x2="750" y2="172" stroke="#bf9000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="20" y="400" width="20" height="14" fill="#d9e2f3" stroke="#2f5496"/><text x="48" y="412" font-size="13">Built in this project</text>
  <rect x="20" y="425" width="20" height="14" fill="#f2f2f2" stroke="#7f7f7f"/><text x="48" y="437" font-size="13">Reused, unchanged</text>
  <rect x="20" y="450" width="20" height="14" fill="#e2efda" stroke="#548235"/><text x="48" y="462" font-size="13">Reused, run in a simulator</text>
  <rect x="20" y="475" width="20" height="14" fill="#fbe5e5" stroke="#c00000" stroke-dasharray="4,3"/><text x="48" y="487" font-size="13">Outside the system (threat)</text>
</svg>
