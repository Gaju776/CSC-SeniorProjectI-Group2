<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5496"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f1f1f">Current workflow: one ground station, several drones, one shared link</text>
  <text x="550" y="60" text-anchor="middle" font-size="15" fill="#555555">MAVLink messages over a telemetry radio, Wi-Fi, cellular or satellite link</text>

  <!-- links -->
  <line x1="240" y1="275" x2="800" y2="125" stroke="#2f5496" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="240" y1="275" x2="800" y2="275" stroke="#2f5496" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="240" y1="275" x2="800" y2="425" stroke="#2f5496" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="560" y="265" text-anchor="middle" font-size="14" fill="#2f5496">commands: take off, mission, return home  &#8594;</text>
  <text x="560" y="295" text-anchor="middle" font-size="14" fill="#2f5496">&#8592;  telemetry: position, battery, status</text>

  <!-- GCS -->
  <rect x="30" y="210" width="210" height="130" rx="10" fill="#d9e2f3" stroke="#2f5496" stroke-width="2"/>
  <text x="135" y="245" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f1f1f">Ground control</text>
  <text x="135" y="267" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f1f1f">station (GCS)</text>
  <text x="135" y="295" text-anchor="middle" font-size="14" fill="#333333">Operator's laptop</text>
  <text x="135" y="317" text-anchor="middle" font-size="14" fill="#333333">at the trailhead</text>

  <!-- Drones -->
  <rect x="800" y="80" width="250" height="90" rx="10" fill="#e2efda" stroke="#548235" stroke-width="2"/>
  <text x="925" y="117" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f1f1f">Drone 1</text>
  <text x="925" y="143" text-anchor="middle" font-size="14" fill="#333333">searching area A</text>
  <rect x="800" y="230" width="250" height="90" rx="10" fill="#e2efda" stroke="#548235" stroke-width="2"/>
  <text x="925" y="267" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f1f1f">Drone 2</text>
  <text x="925" y="293" text-anchor="middle" font-size="14" fill="#333333">searching area B</text>
  <rect x="800" y="380" width="250" height="90" rx="10" fill="#e2efda" stroke="#548235" stroke-width="2"/>
  <text x="925" y="417" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f1f1f">Drone 3</text>
  <text x="925" y="443" text-anchor="middle" font-size="14" fill="#333333">searching area C</text>

  <!-- Outsider -->
  <line x1="545" y1="500" x2="600" y2="371" stroke="#c00000" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="580" y="462" font-size="14" fill="#c00000">listens and injects</text>
  <rect x="380" y="500" width="330" height="110" rx="10" fill="#fbe5e5" stroke="#c00000" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="545" y="528" text-anchor="middle" font-size="16" font-weight="bold" fill="#c00000">Someone else in radio range</text>
  <text x="545" y="556" text-anchor="middle" font-size="14" fill="#333333">1. Reads telemetry (no encryption)</text>
  <text x="545" y="580" text-anchor="middle" font-size="14" fill="#333333">2. Replays or forges commands</text>
  <text x="545" y="600" text-anchor="middle" font-size="14" fill="#333333">(if signing is off)</text>

  <!-- Today note -->
  <rect x="30" y="460" width="320" height="150" rx="10" fill="#f2f2f2" stroke="#7f7f7f" stroke-width="1.5"/>
  <text x="50" y="488" font-size="15" font-weight="bold" fill="#1f1f1f">Today</text>
  <text x="50" y="512" font-size="14" fill="#333333">MAVLink has no encryption.</text>
  <text x="50" y="534" font-size="14" fill="#333333">Signing is optional and off by</text>
  <text x="50" y="556" font-size="14" fill="#333333">default in PX4. When on, all</text>
  <text x="50" y="578" font-size="14" fill="#333333">devices can share one key, and</text>
  <text x="50" y="600" font-size="14" fill="#333333">key setup is left to each team.</text>

  <!-- Semester I note -->
  <rect x="740" y="500" width="330" height="110" rx="10" fill="#fff2cc" stroke="#bf9000" stroke-width="1.5"/>
  <text x="760" y="528" font-size="15" font-weight="bold" fill="#1f1f1f">Semester I contribution</text>
  <text x="760" y="552" font-size="14" fill="#333333">Compare existing protection options</text>
  <text x="760" y="574" font-size="14" fill="#333333">on this same link: security, bandwidth,</text>
  <text x="760" y="596" font-size="14" fill="#333333">delay, packet loss, processing.</text>
</svg>
