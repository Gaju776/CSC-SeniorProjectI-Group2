<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Arial, sans-serif">
  <rect width="900" height="560" fill="white"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold">Middlebrook Impedance Interaction Criterion (concept sketch)</text>

  <!-- plot area -->
  <rect x="120" y="80" width="720" height="400" fill="none" stroke="black" stroke-width="2"/>

  <!-- axes labels -->
  <text x="480" y="530" text-anchor="middle" font-size="16">Frequency f (Hz)</text>
  <text x="30" y="280" text-anchor="middle" font-size="16" transform="rotate(-90 30 280)">|Z| (ohms)</text>

  <!-- y axis ticks -->
  <g font-size="13" fill="black">
    <line x1="120" y1="440" x2="140" y2="440" stroke="black"/>
    <text x="105" y="445" text-anchor="end">0</text>
    <line x1="120" y1="360" x2="140" y2="360" stroke="black"/>
    <text x="105" y="365" text-anchor="end">2</text>
    <line x1="120" y1="280" x2="140" y2="280" stroke="black"/>
    <text x="105" y="285" text-anchor="end">4</text>
    <line x1="120" y1="200" x2="140" y2="200" stroke="black"/>
    <text x="105" y="205" text-anchor="end">6</text>
    <line x1="120" y1="120" x2="140" y2="120" stroke="black"/>
    <text x="105" y="125" text-anchor="end">8</text>
  </g>

  <!-- x axis ticks -->
  <g font-size="13" fill="black">
    <line x1="120" y1="480" x2="120" y2="500" stroke="black"/>
    <text x="120" y="518" text-anchor="middle">0</text>
    <line x1="270" y1="480" x2="270" y2="500" stroke="black"/>
    <text x="270" y="518" text-anchor="middle">20</text>
    <line x1="420" y1="480" x2="420" y2="500" stroke="black"/>
    <text x="420" y="518" text-anchor="middle">40</text>
    <line x1="570" y1="480" x2="570" y2="500" stroke="black"/>
    <text x="570" y="518" text-anchor="middle">60</text>
    <line x1="720" y1="480" x2="720" y2="500" stroke="black"/>
    <text x="720" y="518" text-anchor="middle">80</text>
    <line x1="840" y1="480" x2="840" y2="500" stroke="black"/>
    <text x="840" y="518" text-anchor="middle">100</text>
  </g>

  <!-- negative-resistance region shading -->
  <rect x="330" y="80" width="220" height="400" fill="#FDECEA" opacity="0.6"/>
  <text x="440" y="70" text-anchor="middle" font-size="13" fill="#B71C1C">converter negative incremental resistance region</text>

  <!-- grid impedance Z_grid(f): rising line -->
  <polyline points="120,470 300,420 480,350 660,260 840,150" fill="none" stroke="#1565C0" stroke-width="3"/>
  <text x="700" y="180" font-size="15" fill="#1565C0">Z_grid(f) — grid source impedance</text>

  <!-- converter input impedance Z_in(f): U-shaped/dipping curve -->
  <path d="M120,150 C 220,170 260,260 300,320 C 340,380 380,400 440,395 C 500,390 560,350 640,300 C 720,250 790,190 840,140"
        fill="none" stroke="#E65100" stroke-width="3"/>
  <text x="480" y="455" font-size="15" fill="#E65100">Z_in(f) — data center dynamic input impedance</text>

  <!-- static ZIP impedance (flat) -->
  <line x1="120" y1="300" x2="840" y2="300" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="600" y="290" font-size="15" fill="#6A1B9A">Z_zip — static ZIP model (constant)</text>

  <!-- intersection point -->
  <circle cx="560" cy="312" r="7" fill="#B71C1C"/>
  <text x="575" y="300" font-size="14" font-weight="bold" fill="#B71C1C">possible resonance</text>

  <!-- legend note -->
  <text x="120" y="548" font-size="13" fill="#444">Sketch: when |Z_in(f)| and |Z_grid(f)| interact in the shaded region, oscillations can occur that a static ZIP model cannot predict.</text>
</svg>
